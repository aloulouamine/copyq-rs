[package]
name = "copyq-rs"
version = "0.1.0"
edition = "2021"
description = "Gestionnaire d'historique du presse-papiers inspiré de CopyQ"

[dependencies]
eframe = "0.29"
arboard = "3"
tray-icon = "0.19"
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
log = "0.4"
turso = "0.8"
tokio = { version = "1", features = ["rt"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
security-framework = "3"

[profile.release]
lto = true
strip = true

# Pour produire une application .app : `cargo install cargo-bundle && cargo bundle --release`
[package.metadata.bundle]
name = "CopyQ-rs"
identifier = "com.amine.copyq-rs"
category = "public.app-category.utilities"
short_description = "Historique du presse-papiers"
