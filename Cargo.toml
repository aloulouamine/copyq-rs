[package]
name = "copyq-rs"
version = "0.1.0"
edition = "2021"
description = "Gestionnaire d'historique du presse-papiers inspiré de CopyQ"

[dependencies]
eframe = "0.37"
arboard = "3"
tray-icon = "0.26"
global-hotkey = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
log = "0.4"
# Sans la recherche plein texte (`fts`, inutilisée) : elle embarque tantivy et
# la dépendance `lru` signalée par cargo audit (RUSTSEC-2026-0253).
turso = { version = "0.8", default-features = false, features = ["mimalloc"] }
tokio = { version = "1", features = ["rt"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Interfaces typées d'AppKit / Foundation : plus d'envois de messages bruts.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSError",
    "NSString",
    "NSThread",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "SMAppService",
    "objc2-foundation",
] }
security-framework = "3"

[profile.release]
lto = true
strip = true

# Pour produire une application .app : `cargo install cargo-bundle && cargo bundle --release`
[package.metadata.bundle]
name = "CopyQ-rs"
identifier = "com.amine.copyq-rs"
category = "public.app-category.utilities"
short_description = "Historique du presse-papiers"
