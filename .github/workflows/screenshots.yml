name: Build & captures macOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    # -eo pipefail : une erreur de compilation fait bien échouer l'étape malgré `tee`.
    shell: bash

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      # Compilation plus rapide en CI (pas de LTO).
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: rustup update stable && rustup default stable && rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Tests
        run: cargo test --release 2>&1 | tee test.log

      - name: Build
        run: cargo build --release 2>&1 | tee build.log

      - name: Trousseau macOS (clé de chiffrement)
        run: python3 -c "import subprocess,sys; sys.exit(subprocess.run(['./target/release/copyq-rs','--keychain-selftest'],timeout=60).returncode)" 2>&1 | tee keychain.log

      - name: Images et fichiers (écriture / relecture du presse-papiers)
        run: ./target/release/copyq-rs --media-selftest 2>&1 | tee media.log

      - name: Collage automatique (⌘V dans une autre app)
        run: bash ci/paste_test.sh 2>&1 | tee paste.log

      - name: Tests de bout en bout (vrai presse-papiers macOS)
        run: python3 ci/e2e.py ./target/release/copyq-rs 2>&1 | tee e2e.log

      - name: App empaquetée — lancement au démarrage
        run: bash ci/bundle_selftest.sh 2>&1 | tee login.log

      - name: Historique de démo
        run: python3 ci/seed_history.py "$HOME/Library/Application Support/com.amine.copyq-rs/history.json"

      - name: Captures (clair puis sombre)
        run: |
          mkdir -p shots
          python3 ci/make_png.py /tmp/capture.png 1280 720
          # Copies faites pendant que l'app tourne : une image puis un fichier.
          ./target/release/copyq-rs > shots/run-seed.log 2>&1 &
          PID=$!
          sleep 5
          osascript -e 'set the clipboard to (read (POSIX file "/tmp/capture.png") as «class PNGf»)'
          sleep 2
          printf 'demo' > "/tmp/Présentation client.mov"
          osascript -e 'set the clipboard to (POSIX file "/tmp/Présentation client.mov")'
          sleep 2
          kill $PID || true
          sleep 2
          for mode in light dark; do
            COPYQ_THEME=$mode ./target/release/copyq-rs > "shots/run-$mode.log" 2>&1 &
            PID=$!
            sleep 8
            screencapture -x "shots/$mode.png" || echo "screencapture a échoué"
            kill $PID 2>/dev/null || true
            sleep 2
          done
          COPYQ_THEME=dark COPYQ_OPEN_SETTINGS=1 ./target/release/copyq-rs > shots/run-settings.log 2>&1 &
          PID=$!
          sleep 8
          screencapture -x shots/settings.png || true
          kill $PID 2>/dev/null || true
          sleep 2
          COPYQ_THEME=light COPYQ_OPEN_SETTINGS=limits ./target/release/copyq-rs > shots/run-limits.log 2>&1 &
          PID=$!
          sleep 8
          screencapture -x shots/limits.png || true
          kill $PID 2>/dev/null || true
          ls -la shots

      - name: Publier les captures et journaux (branche ci-results)
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots build.log test.log e2e.log e2e-app.log login.log keychain.log media.log paste.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${GITHUB_SHA}" > commit.txt
          git add -A && git commit -qm "Résultats CI pour ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
