name: Vérification rapide (branches de travail)

# Compilation + Clippy seulement, pour itérer vite sur une branche ;
# la chaîne complète (tests, e2e, captures) tourne sur main.
on:
  push:
    branches-ignore: [main, ci-results, ci-audit, ci-check]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ github.ref_name }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            check-${{ github.ref_name }}-
            macos-cargo-
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings > check.log 2>&1
      - name: Tests
        id: tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked 2>&1 | tail -120 > tests.log
      - name: Publier (branche ci-check)
        if: always()
        run: |
          mkdir -p /tmp/out && cp check.log tests.log Cargo.lock /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          echo "${GITHUB_SHA} clippy=${{ steps.clippy.outcome }} tests=${{ steps.tests.outcome }}" > commit.txt
          git init -q -b ci-check
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Vérification ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-check
