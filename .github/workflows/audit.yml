name: Audit qualité et dépendances

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
      - ci/requirements-screenshots.txt
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
      - ci/requirements-screenshots.txt

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable + composants
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: audit-${{ runner.os }}-${{ runner.arch }}-
      - name: Graphes macOS (dépendances normales et de compilation)
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo tree --locked --target "$target" --edges normal,build > "macos-$target.log"
          done
          cargo tree --locked --duplicates > duplicates.log
      - name: Failles connues (RustSec, bloquant)
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          # Le lockfile entier est audité, sans ignorer d'avis ni masquer l'échec.
          # Les avertissements informatifs GTK/Wayland/D-Bus restent visibles ;
          # leur absence des graphes macOS est documentée dans docs/dependencies-security.md.
          cargo audit --file Cargo.lock 2>&1 | tee audit.log
      - name: Clippy (règles par défaut)
        run: cargo clippy --locked --all-targets 2>&1 | tee clippy-default.log || true
      - name: Clippy (pedantic)
        run: cargo clippy --locked --all-targets -- -W clippy::pedantic 2>&1 | tee clippy-pedantic.log || true
      - name: Formatage
        run: cargo fmt --check 2>&1 | tee fmt.log || true
      - name: Conserver les résultats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          archive: true
          path: '*.log'
          retention-days: 14
